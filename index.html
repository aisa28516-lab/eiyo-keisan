<script src="config.js"></script></head><body><title>栄養価計算</title>
<style>
/* レイアウト：compact幅は1列＋下部タブバー、regular幅は上部タブバー＋2列。
   数値の出典：文字サイズ・行送り・太さ＝HIG Typography、タップ領域＝HIG Accessibility/Buttons、
   アクセント色・赤・橙・緑＝HIG Color（System colors）。「仮」と書いた値はHIGに数値規定がないもの。 */
:root{
  --accent:rgb(0 136 255); --red:rgb(255 56 60); --orange:rgb(255 141 40); --green:rgb(52 199 89);
  --label:CanvasText; --label2:GrayText;
  --bg:color-mix(in srgb,CanvasText 6%,Canvas); --cell:Canvas;
  --sep:color-mix(in srgb,CanvasText 20%,transparent);
  --fill:color-mix(in srgb,CanvasText 10%,transparent);
  --f-large:700 34px/41px; --f-headline:600 17px/22px; --f-body:400 17px/22px;
  --f-subhead:400 15px/20px; --f-footnote:400 13px/18px; --f-title2:700 22px/28px;
  --tap:44px;
  --r:10px; --pad:12px; --dim:color-mix(in srgb,black 40%,transparent); /* 仮 */
  --ff:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:rgb(0 145 255); --red:rgb(255 66 69); --orange:rgb(255 146 48); --green:rgb(48 209 88);
  --bg:Canvas; --cell:color-mix(in srgb,CanvasText 10%,Canvas); color-scheme:dark}}
:root[data-theme="dark"]{
  --accent:rgb(0 145 255); --red:rgb(255 66 69); --orange:rgb(255 146 48); --green:rgb(48 209 88);
  --bg:Canvas; --cell:color-mix(in srgb,CanvasText 10%,Canvas); color-scheme:dark}
@media (prefers-contrast:more){
  :root{--accent:rgb(30 110 244); --red:rgb(233 21 45); --orange:rgb(197 83 0); --green:rgb(0 137 50)}
  :root[data-theme="dark"]{--accent:rgb(92 184 255); --red:rgb(255 97 101); --orange:rgb(255 160 86); --green:rgb(74 217 104)}
}
@media (prefers-contrast:more) and (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--accent:rgb(92 184 255); --red:rgb(255 97 101); --orange:rgb(255 160 86); --green:rgb(74 217 104)}
}
@supports (color:-apple-system-label){:root:not(#a){--label:-apple-system-label}}
@supports (color:-apple-system-secondary-label){:root:not(#a){--label2:-apple-system-secondary-label}}
@supports (color:-apple-system-separator){:root:not(#a){--sep:-apple-system-separator}}
@supports (color:-apple-system-grouped-background){:root:not(#a){--bg:-apple-system-grouped-background}}
@supports (color:-apple-system-secondary-grouped-background){:root:not(#a){--cell:-apple-system-secondary-grouped-background}}
@media (min-width:900px) and (pointer:fine){:root{
  --f-large:700 26px/32px; --f-headline:700 13px/16px; --f-body:400 13px/16px;
  --f-subhead:400 11px/14px; --f-footnote:400 10px/13px; --f-title2:700 17px/22px; --tap:28px}}

body{background:var(--bg);color:var(--label);font:var(--f-body) var(--ff);font:-apple-system-body;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
input,button,select,textarea{font:inherit;color:inherit;margin:0}
button{background:none;border:0;padding:0;text-align:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.large{font:var(--f-large) var(--ff);margin:0;text-wrap:balance}
.headline{font:var(--f-headline) var(--ff);font:-apple-system-headline}
.subhead{font:var(--f-subhead) var(--ff);font:-apple-system-subheadline}
.footnote{font:var(--f-footnote) var(--ff);font:-apple-system-footnote}
.title2{font:var(--f-title2) var(--ff)}
.sec{color:var(--label2)} .num{font-variant-numeric:tabular-nums}
.wrap{overflow-wrap:anywhere;word-break:keep-all}
p{margin:0}

.app{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:8px calc(var(--tap) + 40px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--cell);border-top:1px solid var(--sep);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;min-width:0;min-height:var(--tap);display:grid;place-items:center;text-align:center;color:var(--label2);border-radius:var(--r);white-space:nowrap}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:600;background:var(--fill)}
@media (min-width:900px){
  .app{padding-block:8px 32px}
  .tabbar{position:static;border:0;background:var(--fill);border-radius:var(--r);padding:2px;width:max-content;max-width:100%;margin:8px auto 0}
  .tabbar button{flex:none;padding:0 24px}
  .tabbar button[aria-current="page"]{background:var(--cell)}
}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:var(--tap)}
.stack{display:grid;gap:16px;align-content:start;min-width:0}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:24px}.narrow{max-width:640px}}

section{display:grid;gap:0;min-width:0}
.group{background:var(--cell);border-radius:var(--r);overflow:hidden}
.group>*+*{border-top:1px solid var(--sep)}
.ghead{padding:0 var(--pad) 6px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.gfoot{padding:6px var(--pad) 0}
.note{padding-inline:var(--pad)}
.row{display:flex;align-items:center;gap:12px;min-height:var(--tap);padding:8px var(--pad);width:100%;box-sizing:border-box}
.row>.grow{flex:1;min-width:0;display:grid;gap:2px}
.row .val{white-space:nowrap;text-align:end}
.row.new{animation:flash 1.6s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--accent) 25%,transparent)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.row.new{animation:none}}
/* 行のスワイプ削除：行を横にずらすと、端に赤い削除ボタンが出る（幅は仮） */
.swipe{position:relative;overflow:hidden;--sw:88px}
.swipe>.row{position:relative;z-index:1;background:var(--cell);transition:transform .2s ease-out;touch-action:pan-y}
.swipe.drag>.row{transition:none}
.swipe.open-l>.row{transform:translateX(calc(var(--sw) * -1))}
.swipe.open-r>.row{transform:translateX(var(--sw))}
.swdel{position:absolute;top:0;bottom:0;width:var(--sw);background:var(--red);color:#fff;display:grid;place-items:center;align-content:center;gap:2px;text-align:center;visibility:hidden}
.swdel.t{right:0}.swdel.l{left:0}
.swipe.open-l>.swdel.t,.swipe.drag-l>.swdel.t,.swipe.open-r>.swdel.l,.swipe.drag-r>.swdel.l{visibility:visible}
.swdel svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.swipe>.row{transition:none}}

.seg{display:flex;background:var(--fill);border-radius:var(--r);padding:2px;min-height:var(--tap);box-sizing:border-box}
.seg label{flex:1;min-width:0;white-space:nowrap;display:grid;place-items:center;text-align:center;padding:0 8px;border-radius:calc(var(--r) - 2px);cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--cell);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}

.field{display:grid;gap:6px}
.field>label,.flabel{padding-inline:var(--pad)}
.input{width:100%;box-sizing:border-box;min-height:var(--tap);padding:0 var(--pad);border:0;border-radius:var(--r);background:var(--cell);color:var(--label)}
textarea.input{padding:8px var(--pad);min-height:120px;resize:vertical}
.input::placeholder{color:var(--label2)}
.group .input{border-radius:0;background:transparent}
.inset .input,.input.inset{background:var(--fill);border-radius:var(--r)}
.inline{display:flex;gap:8px;align-items:center}
.inline .input{flex:1;min-width:0}
.rowin{display:flex;align-items:center;gap:8px;min-height:var(--tap);padding:0 var(--pad) 0 0}
.rowin .input{flex:1;min-width:0}
.short{width:96px;flex:none!important;text-align:end}

.btn{white-space:nowrap;min-height:var(--tap);min-width:var(--tap);padding:0 16px;border-radius:var(--r);display:inline-grid;place-items:center;text-align:center;color:var(--accent);box-sizing:border-box}
.btn.primary{background:var(--accent);color:#fff;font-weight:600}
.btn.destructive{color:var(--red)}
.btn.gray{background:var(--fill)}
.btn.block{display:grid;width:100%}
.btn.plain{padding:0 var(--pad)}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.pfc{display:flex;gap:2px;height:16px;border-radius:8px;overflow:hidden;margin:12px var(--pad)}
.pfc>span{min-width:2px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px}
.cp{background:var(--accent)}.cf{background:var(--orange)}.cc{background:var(--green)}
.meter{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--accent)}

dialog{border:0;padding:0;background:var(--bg);color:var(--label);width:100%;max-width:100%;box-sizing:border-box;margin:auto 0 0;max-height:92%;border-radius:var(--r) var(--r) 0 0;overflow:auto}
dialog::backdrop{background:var(--dim)}
dialog.alert{margin:auto;width:min(320px,calc(100% - 32px));border-radius:var(--r)}
@media (min-width:900px){dialog{margin:auto;width:min(480px,calc(100% - 32px));border-radius:var(--r)}}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:6px auto 0}
@media (min-width:900px){.grabber{display:none}}
.sbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:4px 8px;position:sticky;top:0;background:var(--bg);z-index:1}
.sbody{display:grid;gap:16px;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.abody{display:grid;gap:8px;padding:20px 16px 12px;text-align:center}
.abody .footnote{white-space:pre-wrap;user-select:text;-webkit-user-select:text;overflow-wrap:anywhere}
.abtn{display:grid;border-top:1px solid var(--sep)}
.abtn>*+*{border-top:1px solid var(--sep)}
/* モード切り替えの読み込み画面（表示時間と輪の形は仮。HIG に数値の規定なし） */
#modeLoad:not([hidden]){position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;align-content:center;gap:16px;text-align:center;padding:16px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--fill);border-top-color:var(--label2);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* 削除の取り消し（位置と表示時間は仮。HIG に数値の規定なし） */
#undo:not([hidden]){position:fixed;left:16px;right:16px;bottom:calc(var(--tap) + 20px + env(safe-area-inset-bottom,0px));z-index:6;max-width:480px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:4px 4px 4px 16px;border-radius:var(--r);background:var(--label);color:var(--cell)}
#undo .btn{color:inherit;font-weight:600}
@media (min-width:900px){#undo:not([hidden]){bottom:16px}}
@media print{
  .tabbar,#undo,#modeLoad,.navrow,.btn,.seg,select,.noprint{display:none!important}
  .app{padding:0;max-width:none}body{background:#fff}.group{break-inside:avoid;border:1px solid #ccc}
  .cols{grid-template-columns:1fr 1fr;column-gap:16px}:root{--f-body:400 10px/13px;--f-large:700 16px/20px;--f-headline:600 10px/13px;--f-subhead:400 8px/11px;--f-footnote:400 8px/11px;--f-title2:700 12px/15px;--tap:18px}
  .row{padding:2px 8px;min-height:0}.stack,.cols{gap:6px}.meter{display:none}
}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
</style>

/* 目標：エネルギーは入力した式、食塩・食物繊維・PFC比は「日本人の食事摂取基準（2025年版）」の目標量（18歳以上） */

function resolveQty(q,i){

  if(qty&&!qty.pre&&(!qty.suf||qty.suf==='g'||qty.suf==='グラム'))g=qty.num;
  if(qty&&!qty.pre&&qty.suf==='kg')g=qty.num*1000;
  const keep=[];nk(q).split(/\s+/).filter(Boolean).forEach(t=>{if(SW[t]&&!want)want=SW[t];else keep.push(t)});
  if(!keep.length){keep.push(...nk(q).split(/\s+/).filter(Boolean));want=null}
  let s=keep.join(' ');REPL.forEach(([a,b])=>s=s.replace(a,b));
  return{g,qty,want,toks:s.split(/\s+/).map(norm).filter(Boolean),raw:norm(keep.join('')),kana:s,text:q};
}
function pickVariant(gi,want,members){
  const g=G[gi];
  if(want)for(const w of want){const m=g.m.find(i=>F[i][9]===w);if(m!=null)return[m,false]}
  if(members.length<g.m.length)return[members[0],false];
  const head=F[g.m[0]][0].slice(0,2);
  if(MODE==='i'&&['01','10','11'].includes(head)&&(g.b<0||F[g.b][9]!=='そのまま'))for(const p of PRIO){const m=g.m.find(i=>F[i][9]===p);if(m!=null)return[m,true]}
  return[g.b>=0?g.b:g.m[0],false];
}
/* チェーン店のメニュー検索：入力した語がすべて「店名＋メニュー名＋サイズ」に含まれるもの */
const CHK2=D.c.map(c=>c.m.map(m=>norm(c.n+(c.aka||[]).join('')+m[0]+m[1])));
const CHN=D.c.map(c=>[c.n].concat(c.aka||[]).map(norm));   /* 店名と通称 */
function chainSearch(text,max,nameOnly){
  const toks=nk(text).split(/\s+/).map(norm).filter(Boolean),out=[];if(!toks.length)return out;
  for(let ci=0;ci<D.c.length;ci++)for(let mi=0;mi<D.c[ci].m.length;mi++){if(toks.every(t=>(nameOnly?norm(D.c[ci].m[mi][0]):CHK2[ci][mi]).includes(t))){out.push({ch:ci,mi});if(out.length>=max)return out}}
  return out;
}
const extOf=(ci,mi)=>{const c=D.c[ci],m=c.m[mi];return{c:c.n,m:m[0],s:m[1],v:m.slice(2)}};
function search(text){
  const P=parse(text),out=[];if(!P.toks.length)return{P,out};
  S.custom.forEach(c=>{if(P.raw&&norm(c.name).includes(P.raw))out.push({cu:c.id})});
  if(MODE==='i')S.recipes.forEach(d=>{if(P.raw&&d.name&&((d.preset?norm(d.name)===P.raw:norm(d.name).includes(P.raw))||(d.aka||[]).some(a=>norm(a)===P.raw)))out.push({dish:d.id})});
  const chHits=MODE==='i'&&S.tab!=='fr'?chainSearch(P.text,8):[];
  const named=chHits.length&&nk(P.text).split(/\s+/).map(norm).some(t=>t.length>1&&CHN.some(ns=>ns.some(n=>n.startsWith(t))));
  if(named){chHits.forEach(h=>out.push(h));return{P,out}}
  const al=ALIAS[P.raw]||ALIAS[P.toks.join('')]||[],als=new Set(al);
  let k2=P.kana;KJ.forEach(([k,v])=>{if(k2.includes(k))k2=k2.split(k).join(v)});
  const T2=k2.split(/\s+/).map(norm).filter(Boolean),same=T2.join('')===P.toks.join('');
  const hits=[];
  F.forEach((f,i)=>{if(P.toks.every(t=>KEY[i].includes(t))||(!same&&T2.every(t=>KEY[i].includes(t))))hits.push(i)});
  al.forEach(i=>{if(!hits.includes(i))hits.push(i)});
  const lk=S.learned[P.raw];
  const sc=i=>(als.has(i)?-9000+al.indexOf(i)*100:0)+(pkey(i)===lk?-20000:0)+KEY[i].length+(isCooked(i)?3:0);
  hits.sort((a,b)=>sc(a)-sc(b));
  const seen=new Set();
  for(const i of hits){
    const k=pkey(i);if(seen.has(k))continue;seen.add(k);
    let idx=i,tmp=false;
    if(F[i][8]>=0){
      const g=G[F[i][8]],members=hits.filter(h=>F[h][8]===F[i][8]),am=members.filter(h=>als.has(h));
      if(am.length&&!P.want&&!am.includes(g.b))idx=am[0];
      else [idx,tmp]=pickVariant(F[i][8],P.want,am.length?g.m:members);
    }
    out.push({idx,tmp,al:(als.has(i)||als.has(idx)||pkey(i)===lk)&&norm(P.text)!==KEY[idx]?P.text.trim():''});if(out.length>=8)break;
  }
  if(!(P.g>=10)){const h2=chainSearch(P.text,3,true);if(h2.length){out.splice(5);h2.forEach(h=>out.push(h))}}
  return{P,out};
}

function renderSug(inp){
  const key=inp.dataset.add,box=document.querySelector(`[data-sug="${key}"]`),v=inp.value;
  if(!v.trim()){box.innerHTML='';box._r=null;return}
  const segs=segsOf(v);
  if(segs.length>1){const hs=segs.map(sg=>{const R=search(sg);return{sg,R,o:R.out[0]}});box._r={multi:true};
    box.innerHTML=hs.map(h=>{if(!h.o)return `<div class="row" style="border-top:1px solid var(--sep)"><span class="grow"><span class="wrap">${esc(h.sg)}</span><span class="subhead sec">見つかりません（入力欄に残ります）</span></span></div>`;
      const o=h.o,P=h.R.P;let name,amt;
      if(o.ch!=null){name=extName(extOf(o.ch,o.mi));amt=numTxt(P.qty?P.qty.num:1)+' 品'}else if(o.dish){name=S.recipes.find(x=>x.id===o.dish).name;amt=numTxt(P.qty&&!(P.g>=10)?P.qty.num:1)+' 人分'}else if(o.cu){name=S.custom.find(x=>x.id===o.cu).name;amt=P.qty?numTxt(P.qty.num):''}
      else{name=(o.al?o.al+'（'+dispName(o.idx)+'）':dispName(o.idx));const R=resolveQty(P.qty,o.idx);amt=R?R.g+' g':'量は後で入力'}
      return `<div class="row" style="border-top:1px solid var(--sep)"><span class="grow"><span class="wrap">${esc(name)}</span></span><span class="val subhead sec num">${esc(amt)}</span></div>`}).join('')
      +(hs.some(h=>h.o)?`<div style="padding:8px var(--pad);border-top:1px solid var(--sep)"><button class="btn primary block" data-multi="${key}">${hs.filter(h=>h.o).length}件をまとめて追加</button></div>`:'');return}
  const {P,out}=search(v);box._r={P,out};
  if(!out.length){box.innerHTML=`<p class="footnote sec note" style="padding-block:8px">該当する食品が見つかりません。別の呼び方で試すか、マイ食品に登録してください。</p>`;return}
  box.innerHTML=out.map((o,n)=>{
    let name,sub;
    if(o.ch!=null){const e=extOf(o.ch,o.mi);name=extName(e);sub='チェーン店　1品 '+r0(e.v[0])+' kcal'}
    else if(o.dish){const d=S.recipes.find(x=>x.id===o.dish);name=d.name;sub=(d.preset?'定番料理（分量は仮の目安）':'保存したレシピ')+'　1人分 '+r0(sumItems(d.items).v[0]/Math.max(1,d.servings||1))+' kcal'}
    else if(o.cu){const c=S.custom.find(x=>x.id===o.cu);name=c.name;sub='マイ食品　'+(c.basis==='g'?'100 gあたり ':(c.unit||'1食')+'あたり ')+r0(c.v[0]||0)+' kcal'}
    else{const f=F[o.idx],st=stateOf(o.idx);name=o.al||dispName(o.idx);sub=(o.al?dispName(o.idx)+'　':'')+(st?st+(o.tmp?'（仮）':'')+'　':'')+'100 gあたり '+f[3]+' kcal'}
    let right='';
    if(P.qty){if(o.ch!=null)right=numTxt(P.qty.num)+' 品';else if(o.dish)right=(P.g>=10?'1':numTxt(P.qty.num))+' 人分';else if(o.cu)right=numTxt(P.qty.num)+((S.custom.find(x=>x.id===o.cu)||{}).basis==='u'?' 個分':' g');
      else{const R=resolveQty(P.qty,o.idx);right=R?(R.pl?R.pl+'<br>':'')+R.g+' g':'量は次の画面で'}}
    return `<button class="row" data-pick="${n}" data-key="${key}" style="border-top:1px solid var(--sep)"><span class="grow"><span class="wrap">${esc(name)}</span><span class="subhead sec">${esc(sub)}</span></span>${right?`<span class="val subhead sec num" style="white-space:normal;max-width:45%">${right}</span>`:''}</button>`}).join('');
}
function targetList(key){   /* 追加先の配列を返す（必要ならメニューを作る） */
  if(key==='recipe')return{items:curRcp().items,key};
  if(key==='fridge')return{items:S.fridge,key};
  const day=curDay();
  if(String(key).startsWith('new-')){const m={n:S.seq++,meal:+key.slice(4),name:'',items:[]};day.menus.push(m);return{items:m.items,key:m.n}}
  const m=day.menus.find(x=>x.n===+key);return m&&{items:m.items,key:m.n};
}
function makeItem(o,P,key){
  const qn=P.qty?P.qty.num:null;
  const it=o.ch!=null?{n:S.seq++,ext:extOf(o.ch,o.mi),g:qn!=null?qn:1}:o.dish?{n:S.seq++,dish:o.dish,g:qn!=null&&!(P.g>=10)?qn:1}:o.cu?{n:S.seq++,cu:o.cu,g:qn!=null?qn:((S.custom.find(x=>x.id===o.cu)||{}).basis==='u'?1:null)}
    :{n:S.seq++,id:F[o.idx][0],g:null,t:MODE==='i'?'a':'b',r:false,tmp:o.tmp};
  if(!o.dish&&!o.cu&&o.ch==null){if(o.al)it.al=o.al;const R=resolveQty(P.qty,o.idx);if(R)applyPortion(it,R);else if(P.qty&&(P.qty.pre||P.qty.suf))it.pq={num:P.qty.num,u:unitLabel(P.qty)}}
  if(!o.dish&&!o.cu&&o.ch==null&&P.raw)S.learned[P.raw]=pkey(o.idx);
  if(key==='fridge'){it.bought=dkey(new Date());it.use='';it.tmp=false}
  return it;
}
function pick(key,n){
  const box=document.querySelector(`[data-sug="${key}"]`),r=box&&box._r;if(!r)return;
  if(r.multi){pickMulti(key);return}
  if(!r.out[n])return;const o=r.out[n],P=r.P;
  const T=targetList(key);if(!T)return;
  const it=makeItem(o,P,key);
  const rec=curRec();if(rec&&rec.example&&MODE==='i'){rec.example=false}
  T.items.push(it);save();render();
  const row=document.querySelector(`[data-edit="${it.n}"]`);if(row)row.classList.add('new');
  const st=document.querySelector(`[data-st="${T.key}"]`);if(st){st.hidden=false;st.textContent='追加しました：'+itemName(it)+'　'+itemAmount(it)}
  if(it.g==null)openSheet(it.n);else{const inp=document.querySelector(`[data-add="${T.key}"]`);if(inp)inp.focus()}
}
/* 読点・カンマ・改行で区切った文を、まとめて追加する。見つからなかった部分は入力欄に残す */
const segsOf=v=>String(v).split(/[、，,\n]+/).map(x=>x.trim()).filter(Boolean);
function pickMulti(key){
  const inp=document.querySelector(`[data-add="${key}"]`),segs=segsOf(inp.value),rest=[],added=[];
  const hits=segs.map(sg=>{const R=search(sg);return{sg,R,o:R.out[0]}});
  if(!hits.some(h=>h.o))return;
  const T=targetList(key);if(!T)return;
  hits.forEach(h=>{if(!h.o){rest.push(h.sg);return}const it=makeItem(h.o,h.R.P,key);T.items.push(it);added.push(it)});
  const rec=curRec();if(rec&&rec.example&&MODE==='i'){rec.example=false}
  save();render();
  added.forEach(it=>{const row=document.querySelector(`[data-edit="${it.n}"]`);if(row)row.classList.add('new')});
  const noq=added.filter(it=>it.g==null).length;
  const st=document.querySelector(`[data-st="${T.key}"]`);if(st){st.hidden=false;st.textContent=added.length+'件を追加しました。'+(noq?'量が未入力の行が'+noq+'件あります（行をタップして入力）。':'')+(rest.length?'見つからなかった'+rest.length+'件を入力欄に残しました。':'')}
  const ni=document.querySelector(`[data-add="${T.key}"]`);if(ni){ni.value=rest.join('、');ni.focus();if(rest.length)renderSug(ni)}
}
function findItem(n){
  const lists=S.tab==='fr'?[S.fridge]:S.tab==='rcp'?[curRcp()&&curRcp().items]:(curDay()?curDay().menus.map(m=>m.items):[]);
  for(const l of lists){if(!l)continue;const k=l.findIndex(x=>x.n===n);if(k>=0)return{l,k}}
  return null;
}

  else if(ds.chadd!=null)chainAdd(+ds.chadd);
  else if(b.id==='fImp')fridgeImport();
  else if(ds.fuse!=null){readAmt();if(ds.fuse===''){cur.use=''}else{const d=new Date();d.setDate(d.getDate()+(+ds.fuse));cur.use=dkey(d)}drawFridge()}
  else if(b.id==='dPrev'||b.id==='dNext'){const d=dparse(V.date);d.setDate(d.getDate()+(b.id==='dNext'?1:-1));V.date=dkey(d);render()}
  else if(b.id==='dToday'){V.date=dkey(new Date());render()}
  else if(b.id==='newRec'){const r={id:uid('r'),label:'',created:Date.now(),date:dkey(new Date()),target:{},days:[newDay()]};S.records.push(r);V.rec=r.id;V.day=0;V.screen='edit';save();render();window.scrollTo(0,0)}
  else if(ds.again){const o=S.records.find(x=>x.id===ds.again),r={id:uid('r'),label:o.label,created:Date.now(),date:dkey(new Date()),target:JSON.parse(JSON.stringify(o.target||{})),view:o.view,days:[newDay()]};S.records.push(r);V.rec=r.id;V.day=0;V.screen='edit';save();render();window.scrollTo(0,0)}
  else if(ds.open){V.rec=ds.open;V.day=0;V.res=-1;V.screen='edit';render();window.scrollTo(0,0)}
  else if(b.id==='addDay'){const r=curRec();r.days.push(newDay());V.day=r.days.length-1;save();render()}
  else if(b.id==='delDay')ask((V.day+1)+'日目を削除しますか？','この日の入力がすべて消えます。',[{l:'削除',d:1,f:()=>{const r=curRec();r.days.splice(V.day,1);V.day=Math.max(0,V.day-1)}},CANCEL]);
  else if(b.id==='delRec')ask('この記録を削除しますか？','この操作は取り消せません。',[{l:'削除',d:1,f:()=>{S.records=S.records.filter(r=>r.id!==V.rec);V.screen='list'}},CANCEL]);
  else if(ds.madd!=null){const m={n:S.seq++,meal:+ds.madd,name:'',items:[]};curDay().menus.push(m);save();render();const i=document.querySelector(`[data-mname="${m.n}"]`);if(i)i.focus()}
  else if(ds.mdel){const d=curDay(),m=d.menus.find(x=>x.n===+ds.mdel),go=()=>{d.menus=d.menus.filter(x=>x!==m)};
    if(m.items.length)ask('このメニューを削除しますか？',(m.name||'メニュー')+'の'+m.items.length+'品が消えます。',[{l:'削除',d:1,f:go},CANCEL]);else{Undo.take();go();save();render();Undo.show('メニューを削除しました')}}
  else if(ds.pick!=null)pick(ds.key,+ds.pick);
  else if(ds.multi!=null)pickMulti(ds.multi);
  else if(b.id==='undoBtn')Undo.back();
  else if(ds.bak!=null)ask('この時点に戻しますか？','いまのデータは、この時点の内容で置き換わります（直後なら「取り消す」で戻せます）。',[{l:'戻す',d:1,f:()=>Backup.restore(+ds.bak)},CANCEL]);
  else if(ds.mdup){const d=curDay(),k=d.menus.findIndex(x=>x.n===+ds.mdup);if(k>=0){d.menus.splice(k+1,0,cloneMenu(d.menus[k]));save();render()}}
  else if(b.id==='dupOpen')openDup();
  else if(b.id==='dupDay'){const r=curRec(),d=curDay();r.days.push({chk:[false,false,false,false],menus:d.menus.map(m=>cloneMenu(m))});V.day=r.days.length-1;save();render();$('sheet').close()}
  else if(ds.dupmeal){const [f,t]=ds.dupmeal.split('-').map(Number),d=curDay();d.menus.filter(m=>m.meal===f&&m.items.length).forEach(m=>d.menus.push(cloneMenu(m,t)));save();render();$('dupMsg').textContent=MEALS[f]+'を'+MEALS[t]+'に複製しました。'}
  else if(ds.rowdel){const f=findItem(+ds.rowdel);if(f){Undo.take();f.l.splice(f.k,1);save();render();Undo.show('行を削除しました')}}
  else if(ds.edit){if(Swipe.justMoved||Swipe.justClosed||Swipe.closeAll()){Swipe.justClosed=false;return}openSheet(+ds.edit)}
  else if(b.id==='confirm'){const d=curRec();d.days.forEach(x=>x.menus=x.menus.filter(m=>m.items.length||m.name));V.res=d.days.length>1?-1:0;V.screen='result';if(!d.self)d.dv=D.ver;save();render();window.scrollTo(0,0)}
  else if(b.id==='setTarget')openTarget();
  else if(b.id==='clearTarget'){cur={em:'kg'};drawTarget()}
  else if(b.id==='copyRes')copyText(textOfRecord(),b);
  else if(b.id==='copyKarte')copyText(karteText(),b);
  else if(b.id==='printRes')window.print();
  else if(b.id==='csvRes'){const r=curRec(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csvOfRecord()],{type:'text/csv'}));a.download='食事記録_'+(r.label||'記録').replace(/[\\/:*?"<>|]/g,'_')+'_'+(r.self?V.date:recDate(r))+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
  else if(b.id==='karteSave'){S.karte=$('karteT').value;save();$('karteMsg').textContent='保存しました。'}
  else if(b.id==='karteReset'){delete S.karte;save();render()}
  else if(b.id==='copyRcp')copyText(textOfRecipe(),b);
  else if(b.id==='newRcp'){const r={id:uid('d'),name:'',servings:2,items:[]};S.recipes.push(r);V.rcp=r.id;V.screen='rcpedit';save();render();window.scrollTo(0,0)}
  else if(ds.ropen){V.rcp=ds.ropen;V.screen='rcpedit';render();window.scrollTo(0,0)}
  else if(b.id==='servM'||b.id==='servP'){const r=curRcp();r.servings=Math.max(1,(r.servings||1)+(b.id==='servP'?1:-1));save();render()}
  else if(b.id==='rcpConfirm'){V.per=1;V.screen='rcpres';render();window.scrollTo(0,0)}
  else if(b.id==='delRcp')ask('このレシピを削除しますか？','記録の中でこのレシピを使った行は、計算できなくなります。',[{l:'削除',d:1,f:()=>{S.recipes=S.recipes.filter(r=>r.id!==V.rcp);V.screen='rcplist'}},CANCEL]);
  else if(b.id==='newCu')openCustom(null);
  else if(ds.cu)openCustom(ds.cu);
  else if(b.id==='delCu'){Undo.take();S.custom=S.custom.filter(x=>x.id!==cur.id);save();render();$('sheet').close();Undo.show('マイ食品を削除しました')}
  else if(b.id==='sIn'||b.id==='sUp'){const em=$('sEmail').value.trim(),pw=$('sPw').value;if(!em||!pw){$('syncMsg').textContent='メールアドレスとパスワードを入力してください。';return}
    b.disabled=true;$('syncMsg').textContent='接続しています…';Sync.sign(b.id==='sUp'?'up':'in',em,pw).then(()=>{render();Sync.show()},x=>{b.disabled=false;$('syncMsg').textContent=x.message})}
  else if(b.id==='sNow'){$('syncMsg').textContent='同期しています…';Sync.pull()}
  else if(b.id==='sOut')ask('ログアウトしますか？','この端末のデータは残りますが、同期は止まります。',[{l:'ログアウト',d:1,f:()=>Sync.setAuth(null)},CANCEL]);
  else if(b.id==='cancel')$('sheet').close();
  else if(b.id==='done')commit();
  else if(b.id==='del'){const f=findItem(cur.n);Undo.take();if(f)f.l.splice(f.k,1);save();render();$('sheet').close();Undo.show('行を削除しました')}
  else if(ds.bp!=null){const p=portionsFor(IDX[cur.id])[+ds.bp];if(!p)return;cur.pc=cur.pk===p.l?(cur.pc||1)+1:1;cur.pk=p.l;
    delete cur.pq;applyPortion(cur,{g:Math.round(p.g*cur.pc*10)/10,pl:(cur.pc===1?'':cur.pc+' × ')+p.l,t:p.t,w:p.w,v:p.v});cur.tmp=false;drawSheet()}
  else if(b.id==='halve'){readAmt();if(cur.g){cur.g=Math.round(cur.g*5)/10;cur.pl=cur.pl?cur.pl+' の半分':'';cur.pc=0;cur.pk=''}drawSheet()}
  else if(b.id==='padd'){readAmt();const lab=$('plabel').value.trim();if(lab&&cur.g>0){const k=pkey(IDX[cur.id]);(S.portions[k]=S.portions[k]||[]).push({label:lab,g:cur.g});save();drawSheet()}else $('plabel').focus()}
  else if(ds.pdel!=null){const k=pkey(IDX[cur.id]);S.portions[k].splice(+ds.pdel,1);save();readAmt();drawSheet()}
  else if(b.id==='expBtn'){$('io').value=JSON.stringify(S);$('io').select();$('ioMsg').textContent='書き出しました。全体を選択してコピーし、別の端末の同じ欄に貼り付けて読み込みます。'}
  else if(b.id==='impBtn'){let t=null;try{t=JSON.parse($('io').value)}catch(x){}
    if(!t||!Array.isArray(t.records)){$('ioMsg').textContent='読み込めませんでした。書き出したデータをそのまま貼り付けてください。';return}
    ask('貼り付けたデータで置き換えますか？','この端末のいまのデータは消えます。',[{l:'置き換える',d:1,f:()=>{const mode=S.mode;S=Object.assign({tab:'set',seq:1,records:[],recipes:[],custom:[],portions:{},learned:{}},t,{mode});S.tab='set';fixS()}},CANCEL])}
  else if(b.id==='wipe')ask('すべてのデータを消去しますか？','両方のモードの記録、冷蔵庫、レシピ、マイ食品、目安量がすべて消えます。',[{l:'消去',d:1,f:()=>{const mode=S.mode;S={tab:'set',mode,seq:2,records:[],recipes:[],custom:[],portions:{},learned:{},updated:0};fixS()}},CANCEL]);
  else if(ds.a!=null){const x=$('alert')._b[+ds.a];$('alert').close();if(x.f){if(x.d)Undo.take();x.f();save();render();if(x.d&&x.l!=='ログアウト')Undo.show(x.l==='削除'?'削除しました':x.l+'しました')}}
});
/* 行のスワイプ：左に動かすと右端に削除ボタンが出る（iOS 標準と同じ向き）。半分以上引くと開いたままになる */
const Swipe={justMoved:false,justClosed:false,
  closeAll(){const o=document.querySelectorAll('.swipe.open-l,.swipe.open-r');o.forEach(x=>x.classList.remove('open-l','open-r'));return o.length>0}};
(()=>{let el=null,x0=0,y0=0,base=0,dx=0,on=false;const W=88;
  document.addEventListener('touchstart',e=>{const r=e.target.closest('.swipe>.row');Swipe.justMoved=false;
    if(!r){if(!e.target.closest('.swdel'))Swipe.closeAll();return}
    el=r.parentElement;Swipe.justClosed=false;document.querySelectorAll('.swipe.open-l,.swipe.open-r').forEach(x=>{if(x!==el){x.classList.remove('open-l','open-r');Swipe.justClosed=true}});
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;base=el.classList.contains('open-l')?-W:el.classList.contains('open-r')?W:0;dx=0;on=false},{passive:true});
  document.addEventListener('touchmove',e=>{if(!el)return;const mx=e.touches[0].clientX-x0,my=e.touches[0].clientY-y0;
    if(!on){if(Math.abs(mx)<10||Math.abs(mx)<Math.abs(my)){if(Math.abs(my)>10)el=null;return}on=true;el.classList.add('drag')}
    dx=Math.max(-W,Math.min(0,base+mx));el.classList.toggle('drag-l',dx<0);el.classList.toggle('drag-r',dx>0);
    el.querySelector('.row').style.transform='translateX('+dx+'px)'},{passive:true});
  const end=()=>{if(!el)return;const r=el.querySelector('.row');if(on){Swipe.justMoved=true;r.style.transform='';el.classList.remove('drag','drag-l','drag-r','open-l','open-r');
      if(dx<=-W/2)el.classList.add('open-l');else if(dx>=W/2)el.classList.add('open-r');setTimeout(()=>Swipe.justMoved=false,350)}el=null;on=false};
  document.addEventListener('touchend',end,{passive:true});document.addEventListener('touchcancel',end,{passive:true})})();
(()=>{let y0=null;const s=$('sheet');
  s.addEventListener('touchstart',e=>{y0=(e.target.closest('.sbar,.grabber')&&s.scrollTop===0)?e.touches[0].clientY:null},{passive:true});
  s.addEventListener('touchend',e=>{if(y0!=null&&e.changedTouches[0].clientY-y0>80)s.close();y0=null},{passive:true})})();
/* モードの切り替え：読み込み画面をはさんで、タブと最初の画面ごと入れ替える */
function switchMode(){
  const to=SELF()?'pro':'self',L=$('modeLoad');$('modeMsg').textContent=MNAME[to]+'に切り替えています';L.hidden=false;
  setTimeout(()=>{S.mode=to;S.tab=TABSET[to][0][0];V.screen='list';V.date=dkey(new Date());save();render();window.scrollTo(0,0);
    setTimeout(()=>{L.hidden=true},500)},400);
}
if(!TABSET[S.mode].some(t=>t[0]===S.tab))S.tab=TABSET[S.mode][0][0];
V.screen=S.tab==='rcp'?'rcplist':'list';
render();
if(Sync.on()){Sync.pull();setInterval(()=>{if(!document.hidden&&Sync.idle())Sync.pull()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Sync.idle())Sync.pull()})}
if('serviceWorker' in navigator&&CFG)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
